name: "Cleanup: GHCR Packages"

# Monthly cleanup of the GHCR package of this repository; rules and retention
# in the reusable workflow. Run manually with dry-run first to see what would
# be deleted.

on:
  schedule:
    - cron: "17 4 1 * *"  # monthly, 1st at 04:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

concurrency:
  group: cleanup-packages

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    uses: tuxpeople/shared/.github/workflows/ghcr-cleanup.yml@10ff786fd8c8860f2c25d1accdccb58f4eb8a612 # v1.0.0
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
