name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/Branch/SHA to build. Empty = current branch."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # On every push to main: maintain the release PR. Only its merge sets
  # released == 'true'.
  release-please:
    if: github.event_name == 'push'
    uses: tuxpeople/shared/.github/workflows/release-please.yml@3c7eb0e8fbc28b56b40366b711be26511674fa52 # v1.1.0
    with:
      client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Safety net -- tests.yml already ran on the same commit.
  tests:
    needs: release-please
    if: >-
      ${{ always() && needs.release-please.result != 'failure' &&
          (needs.release-please.outputs.released == 'true'
           || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  # Runs after a merged release PR, or manually via "Run workflow".
  image:
    needs: [release-please, tests]
    if: ${{ always() && needs.tests.result == 'success' }}
    permissions:
      contents: write # Attach the SBOM to the GitHub Release
      packages: write # Push image to GHCR
      id-token: write # Cosign keyless signing + attestations
      security-events: write # Upload Trivy SARIF results
      attestations: write # GitHub attestations
      artifact-metadata: write # Attestation storage record
    uses: tuxpeople/shared/.github/workflows/container-release.yml@3c7eb0e8fbc28b56b40366b711be26511674fa52 # v1.1.0
    with:
      ref: ${{ inputs.ref || github.sha }}
      attach-sbom: ${{ needs.release-please.outputs.released == 'true' }}
